<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مزون کودکانه | سامانه کرایه لباس</title>
<style>
/* ============================================================
   طراحی رابط کاربری — مزون کودکانه
   ============================================================ */
:root{
  --rose:#c2437a; --rose-dark:#9c2f5e; --rose-light:#fbe9f1;
  --plum:#5e2b47; --lav:#8b7bb8; --lav-light:#efeafd;
  --mint:#2f9e8f; --mint-light:#e3f4f1;
  --gold:#d9a441; --gold-light:#fbf3df;
  --blue:#3e7cb1; --blue-light:#e8f1f9;
  --danger:#d64545; --danger-light:#fdecec;
  --bg:#fdf6f9; --card:#ffffff; --ink:#3a2a33; --muted:#9a8494;
  --line:#f3e0ea; --radius:18px;
  --shadow:0 6px 24px rgba(94,43,71,.08);
  --shadow-lg:0 18px 50px rgba(94,43,71,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  background-image:radial-gradient(rgba(194,67,122,.06) 1px, transparent 1px);
  background-size:22px 22px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
.ltr{direction:ltr;unicode-bidi:embed}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#e6c6d6;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- چیدمان کلی ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:262px;position:fixed;inset-inline-start:0;top:0;bottom:0;z-index:60;
  background:linear-gradient(165deg,#5e2b47 0%,#8e3563 55%,#c2437a 100%);
  color:#fff;display:flex;flex-direction:column;padding:22px 16px;
  transition:transform .3s ease;overflow-y:auto;
}
.sidebar::after{content:'';position:absolute;width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.07);top:-70px;inset-inline-end:-80px;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:18px;position:relative;z-index:1}
.brand-logo{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;backdrop-filter:blur(4px)}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.brand p{font-size:11.5px;opacity:.75;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:13px;
  font-size:14.5px;font-weight:600;color:rgba(255,255,255,.82);text-align:right;width:100%;
  transition:all .2s;
}
.nav-item:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-item.active{background:#fff;color:var(--rose-dark);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.nav-item svg{flex-shrink:0}
.nav-badge{margin-inline-start:auto;background:var(--gold);color:#fff;font-size:11px;font-weight:800;
  min-width:22px;height:22px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.nav-item.active .nav-badge{background:var(--rose);color:#fff}
.sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.sidebar-footer button{display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:11px;
  font-size:13px;font-weight:600;color:rgba(255,255,255,.85);transition:all .2s;text-align:right}
.sidebar-footer button:hover{background:rgba(255,255,255,.12);color:#fff}
.sidebar-ver{text-align:center;font-size:10.5px;opacity:.5;margin-top:6px}
.main{flex:1;margin-inline-start:262px;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(253,246,249,.88);backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--line);
}
.topbar h2{font-size:21px;font-weight:800}
.topbar-actions{margin-inline-start:auto;display:flex;gap:10px;align-items:center}
.menu-btn{display:none}
.content{padding:26px 28px 60px;max-width:1280px;width:100%;margin:0 auto}
.view{display:none;animation:fadeUp .35s ease}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.overlay{position:fixed;inset:0;background:rgba(58,42,51,.45);z-index:55;display:none;backdrop-filter:blur(2px)}

/* ---------- دکمه‌ها ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:13px;
  font-size:14px;font-weight:700;transition:all .2s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:#fff;
  box-shadow:0 8px 20px rgba(194,67,122,.32)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(194,67,122,.4)}
.btn-ghost{background:var(--rose-light);color:var(--rose-dark)}
.btn-ghost:hover{background:#f8d9e7}
.btn-outline{border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.btn-outline:hover{border-color:var(--rose);color:var(--rose-dark)}
.btn-danger{background:var(--danger-light);color:var(--danger)}
.btn-danger:hover{background:#fbdcdc}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.icon-btn{width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;
  background:#fff;border:1px solid var(--line);color:var(--muted);transition:all .2s;flex-shrink:0}
.icon-btn:hover{color:var(--rose-dark);border-color:var(--rose);transform:translateY(-1px)}
.icon-btn.danger:hover{color:var(--danger);border-color:var(--danger)}

/* ---------- کارت‌ها و آمار ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:15px;border:1px solid #fdf0f5;transition:transform .2s}
.stat-card:hover{transform:translateY(-3px)}
.stat-icon{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon.blue{background:var(--blue-light);color:var(--blue)}
.stat-icon.rose{background:var(--rose-light);color:var(--rose)}
.stat-icon.gold{background:var(--gold-light);color:var(--gold)}
.stat-icon.mint{background:var(--mint-light);color:var(--mint)}
.stat-icon.lav{background:var(--lav-light);color:var(--lav)}
.stat-icon.danger{background:var(--danger-light);color:var(--danger)}
.stat-info small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.stat-info strong{font-size:21px;font-weight:800}
.grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
.card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);border:1px solid #fdf0f5}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-head h3{font-size:16px;font-weight:800}
.upcoming-row{display:flex;align-items:center;gap:13px;padding:12px 10px;border-radius:13px;cursor:pointer;transition:background .2s;border-bottom:1px solid #faf0f4}
.upcoming-row:last-child{border-bottom:none}
.upcoming-row:hover{background:var(--rose-light)}
.upcoming-avatar{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--rose-light),var(--lav-light));
  color:var(--rose-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.upcoming-info{flex:1;min-width:0}
.upcoming-info strong{display:block;font-size:14px}
.upcoming-info span{font-size:12px;color:var(--muted)}
.upcoming-date{text-align:left;font-size:12px;color:var(--muted);line-height:1.7}
.upcoming-date b{color:var(--ink);font-size:12.5px}

/* نمودار میله‌ای */
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.chart-bar{width:100%;max-width:44px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--rose),#e88bb2);
  min-height:6px;position:relative;transition:height .5s ease}
.chart-bar.today{background:linear-gradient(180deg,var(--gold),#ecc27a)}
.chart-count{font-size:12px;font-weight:800;color:var(--rose-dark)}
.chart-label{font-size:11px;color:var(--muted);text-align:center;line-height:1.5}

/* ---------- نوار ابزار و جدول ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
.search-box{position:relative;flex:1;min-width:230px}
.search-box svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-box input{width:100%;padding:12px 42px 12px 14px;border-radius:13px;border:1.5px solid var(--line);
  background:#fff;transition:all .2s;outline:none}
.search-box input:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(194,67,122,.1)}
.filter-select{padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);background:#fff;outline:none;cursor:pointer}
.filter-select:focus{border-color:var(--rose)}
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid #fdf0f5;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
thead th{background:#fdf2f7;padding:14px 16px;font-size:12.5px;font-weight:800;color:var(--plum);text-align:right;white-space:nowrap;border-bottom:2px solid var(--line)}
tbody td{padding:14px 16px;font-size:13.5px;border-bottom:1px solid #faf0f4;vertical-align:middle;white-space:nowrap}
tbody tr{transition:background .15s}
tbody tr:hover{background:#fff7fa}
tbody tr:last-child td{border-bottom:none}
.cell-customer strong{display:block;font-size:14px}
.cell-customer span{font-size:12px;color:var(--muted)}
.cell-sub{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.code-chip{display:inline-block;background:var(--lav-light);color:#5f4f96;font-weight:800;font-size:12px;
  padding:4px 10px;border-radius:8px;letter-spacing:.5px}
.money{font-weight:700}
.money.remaining{color:var(--danger)}
.money.zero{color:var(--mint)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:700}
.badge.reserved{background:var(--blue-light);color:var(--blue)}
.badge.delivered{background:var(--lav-light);color:#6a57a8}
.badge.returned{background:var(--mint-light);color:var(--mint)}
.badge.cancelled{background:#f0eef0;color:#8a7a83}
.badge.conflict{background:var(--danger-light);color:var(--danger);animation:pulse 1.6s infinite}
.badge.paid{background:var(--mint-light);color:var(--mint)}
.badge.partial{background:var(--gold-light);color:#b07d1e}
.badge.unpaid{background:var(--danger-light);color:var(--danger)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.row-actions{display:flex;gap:6px}
.empty-state{text-align:center;padding:52px 20px;color:var(--muted)}
.empty-state svg{opacity:.35;margin-bottom:14px}
.empty-state p{font-size:14.5px;font-weight:600}

/* ---------- تقویم ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.cal-title{font-size:19px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-weekday{text-align:center;font-size:12.5px;font-weight:800;color:var(--plum);padding:8px 0}
.cal-weekday.friday{color:var(--danger)}
.cal-day{background:#fff;border:1.5px solid #f7e7ef;border-radius:14px;min-height:96px;padding:8px;cursor:pointer;
  transition:all .2s;position:relative;overflow:hidden}
.cal-day:hover{border-color:var(--rose);transform:translateY(-2px);box-shadow:var(--shadow)}
.cal-day.empty{background:transparent;border:none;cursor:default;pointer-events:none}
.cal-day.today{border-color:var(--gold);background:var(--gold-light)}
.cal-day.conflict{border-color:var(--danger);background:#fff5f5}
.cal-day-num{font-size:13px;font-weight:800;display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:8px}
.cal-day.today .cal-day-num{background:var(--gold);color:#fff}
.cal-chips{display:flex;flex-direction:column;gap:4px;margin-top:5px}
.cal-chip{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-chip.reserved{background:var(--blue-light);color:var(--blue)}
.cal-chip.delivered{background:var(--lav-light);color:#6a57a8}
.cal-chip.returned{background:var(--mint-light);color:var(--mint)}
.cal-chip.cancelled{background:#f0eef0;color:#8a7a83;text-decoration:line-through}
.cal-more{font-size:10px;color:var(--muted);font-weight:700;padding-inline-start:4px}

/* ---------- لباس‌ها ---------- */
.clothes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cloth-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);
  border:1px solid #fdf0f5;transition:transform .2s;position:relative;overflow:hidden}
.cloth-card::before{content:'';position:absolute;top:0;inset-inline:0;height:4px;background:linear-gradient(90deg,var(--rose),var(--lav))}
.cloth-card:hover{transform:translateY(-4px)}
.cloth-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.cloth-name{font-size:15px;font-weight:800;margin:8px 0 4px}
.cloth-meta{font-size:12.5px;color:var(--muted);line-height:2}
.cloth-price{font-size:15px;font-weight:800;color:var(--rose-dark);margin-top:8px}
.cloth-actions{display:flex;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid #faf0f4}
.cloth-actions .btn{flex:1;justify-content:center}
.badge.ready{background:var(--mint-light);color:var(--mint)}
.badge.cleaning{background:var(--gold-light);color:#b07d1e}
.badge.repair{background:var(--danger-light);color:var(--danger)}

/* ---------- مودال ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(58,42,51,.5);backdrop-filter:blur(4px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:22px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);animation:popIn .28s cubic-bezier(.34,1.4,.64,1)}
.modal.wide{max-width:760px}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 0}
.modal-head h3{font-size:18px;font-weight:800}
.modal-body{padding:20px 24px}
.modal-foot{display:flex;gap:10px;padding:0 24px 24px;justify-content:flex-end;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:700;color:var(--plum)}
.field label .req{color:var(--danger)}
.field input,.field select,.field textarea{
  padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fffdfd;outline:none;transition:all .2s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(194,67,122,.1)}
.field textarea{resize:vertical;min-height:70px}
.field .hint{font-size:11px;color:var(--muted)}
.field .error-msg{font-size:11.5px;color:var(--danger);font-weight:600;display:none}
.field.invalid input{border-color:var(--danger)}
.field.invalid .error-msg{display:block}
.jalali-picker{display:flex;gap:8px}
.jalali-picker select{flex:1;padding:11px 8px;border-radius:12px;border:1.5px solid var(--line);background:#fffdfd;outline:none;cursor:pointer;text-align:center}
.jalali-picker select:focus{border-color:var(--rose)}
.calc-box{background:linear-gradient(135deg,var(--rose-light),var(--lav-light));border-radius:15px;padding:16px 18px;margin-top:16px}
.calc-row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--plum)}
.calc-row.total{font-weight:800;font-size:15px;border-top:1px dashed rgba(94,43,71,.25);margin-top:6px;padding-top:10px}
.calc-row.remaining b{color:var(--danger)}
.conflict-box{background:var(--danger-light);border:1.5px solid #f5c2c2;border-radius:14px;padding:14px 16px;margin-top:14px;display:none}
.conflict-box.show{display:block;animation:fadeUp .3s ease}
.conflict-box h4{color:var(--danger);font-size:13.5px;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.conflict-box ul{list-style:none;font-size:12.5px;color:#8a3a3a;line-height:2}
.ok-box{background:var(--mint-light);border:1.5px solid #bfe6df;border-radius:14px;padding:12px 16px;margin-top:14px;
  display:none;font-size:13px;color:#1f6f64;font-weight:700;align-items:center;gap:8px}
.ok-box.show{display:flex}

/* جزئیات رزرو */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-item{background:#fff7fa;border-radius:13px;padding:13px 15px}
.detail-item small{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
.detail-item strong{font-size:14px}
.progress-wrap{margin-top:16px}
.progress-bar{height:12px;background:#f3e0ea;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--mint),#5cc9bb);border-radius:99px;transition:width .5s ease}
.progress-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px;font-weight:600}
.status-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.day-res-row{display:flex;align-items:center;gap:12px;padding:13px;border:1.5px solid #f7e7ef;border-radius:14px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.day-res-row:hover{border-color:var(--rose);background:#fff7fa}

/* ---------- اعلان (Toast) ---------- */
#toast-root{position:fixed;bottom:22px;inset-inline-start:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--plum);color:#fff;padding:14px 20px;border-radius:14px;font-size:13.5px;font-weight:700;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastIn .3s ease;max-width:340px}
.toast.success{background:var(--mint)}
.toast.error{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- رسید چاپ ---------- */
#receipt-print{display:none}
.receipt{max-width:640px;margin:0 auto;border:2px solid var(--plum);border-radius:16px;padding:28px;font-family:inherit}
.receipt h2{text-align:center;font-size:22px;color:var(--plum);margin-bottom:4px}
.receipt .r-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
.receipt table{width:100%;border-collapse:collapse;min-width:0}
.receipt td{border:1px solid var(--line);padding:10px 13px;font-size:13.5px}
.receipt td:first-child{background:#fdf2f7;font-weight:700;width:38%}
.receipt .r-sign{display:flex;justify-content:space-between;margin-top:34px;font-size:13px;color:var(--muted)}
@media print{
  body>*:not(#receipt-print){display:none!important}
  #receipt-print{display:block!important}
}

/* ---------- واکنش‌گرا ---------- */
@media (max-width:1100px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
}
@media (max-width:860px){
  .sidebar{transform:translateX(105%)}
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .overlay.show{display:block}
  .main{margin-inline-start:0}
  .menu-btn{display:inline-flex}
  .content{padding:18px 14px 50px}
  .topbar{padding:13px 16px}
  .topbar h2{font-size:17px}
}
@media (max-width:640px){
  .stats-grid{grid-template-columns:1fr 1fr;gap:10px}
  .stat-card{padding:14px;flex-direction:column;align-items:flex-start;gap:9px}
  .stat-info strong{font-size:16px}
  .form-grid,.detail-grid{grid-template-columns:1fr}
  .cal-day{min-height:64px;padding:5px}
  .cal-chip{display:none}

   ۴) Service ها          — منطق کسب‌وکار: محاسبه مبالغ، تشخیص تداخل، جستجو (SRP)
   ۵) View ها             — فقط نمایش و رویدادهای UI (DIP: وابسته به Service)

/* ---------------- ابزارهای عمومی ---------------- */
const $  = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const fmtMoney = n => toFa(Number(n || 0).toLocaleString('fa-IR'));

function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayISO(){ return toISO(new Date()); }
function addDaysISO(iso, days){ const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + days); return toISO(d); }
function download(blob, filename){
  const a = document.createElement('a');

/* ---------------- الگوریتم تقویم شمسی (جلالی) ---------------- */
function div(a, b){ return Math.trunc(a / b); }
function jalCal(jy){
  const breaks = [-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  const bl = breaks.length;
  let gy = jy + 621, leapJ = -14, jp = breaks[0], jump = 0;
  if (jy < jp || jy >= breaks[bl - 1]) throw new Error('Invalid Jalaali year ' + jy);
  for (let i = 1; i < bl; i++){
    const jm = breaks[i]; jump = jm - jp;
    if (jy < jm) break;
    leapJ = leapJ + div(jump, 33) * 8 + div(jump % 33, 4); jp = jm;
  }
  let n = jy - jp;
  leapJ = leapJ + div(n, 33) * 8 + div(n % 33 + 3, 4);
  if (jump % 33 === 4 && jump - n === 4) leapJ += 1;
  const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
  const march = 20 + leapJ - leapG;
  if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
  let leap = (((n + 1) % 33) - 1) % 4;
  if (leap === -1) leap = 4;
  return { leap, gy, march };
}
/* شماره روز ژولیوس برای تاریخ میلادی (فرمول Fliegel–Van Flandern) */
function gregorianToDayNumber(gy, gm, gd){
  const a = div(14 - gm, 12);
  const y = gy + 4800 - a;
  const m = gm + 12 * a - 3;
  return gd + div(153 * m + 2, 5) + 365 * y + div(y, 4) - div(y, 100) + div(y, 400) - 32045;
}
/* شماره روزِ اول فروردین سال شمسی jy */
function farvardin1DayNumber(jy){
  const r = jalCal(jy);
  return gregorianToDayNumber(r.gy, 3, r.march);
}
/* تبدیل میلادی به شمسی */
function gregorianToJalali(gy, gm, gd){
  const dn = gregorianToDayNumber(gy, gm, gd);
  let jy = gy - 621;
  while (dn < farvardin1DayNumber(jy)) jy--;
  while (dn >= farvardin1DayNumber(jy + 1)) jy++;
  const offset = dn - farvardin1DayNumber(jy); // روز صفرم = اول فروردین
  let jm, jd;
  if (offset <= 185){ jm = 1 + div(offset, 31); jd = (offset % 31) + 1; }
  else { const k = offset - 186; jm = 7 + div(k, 30); jd = (k % 30) + 1; }
  return { jy, jm, jd };
}
/* تبدیل شمسی به میلادی */
function jalaliToGregorian(jy, jm, jd){
  const r = jalCal(jy);
  const offset = (jm - 1) * 31 - div(jm, 7) * (jm - 7) + (jd - 1);
  const d = new Date(r.gy, 2, r.march + offset); // ماه مارس = ایندکس ۲
  return { gy: d.getFullYear(), gm: d.getMonth() + 1, gd: d.getDate() };
}

/* ---------------- سرویس تاریخ شمسی ---------------- */
class JalaliDateService {
  static MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  static WEEKDAYS = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];

  static isLeap(jy){ return jalCal(jy).leap === 0; }
  static monthLength(jy, jm){ return jm <= 6 ? 31 : jm <= 11 ? 30 : (this.isLeap(jy) ? 30 : 29); }
  static toGregorian(jy, jm, jd){ return jalaliToGregorian(jy, jm, jd); }
  static fromGregorian(gy, gm, gd){ return gregorianToJalali(gy, gm, gd); }
  static isoToJalali(iso){ const [gy, gm, gd] = iso.split('-').map(Number); return this.fromGregorian(gy, gm, gd); }
  static jalaliToISO(jy, jm, jd){
    const g = this.toGregorian(jy, jm, jd);
    return `${g.gy}-${String(g.gm).padStart(2,'0')}-${String(g.gd).padStart(2,'0')}`;
  }
  static weekdayIndex(iso){ return (new Date(iso + 'T12:00:00').getDay() + 1) % 7; } // شنبه = ۰
  static format(iso){
    if (!iso) return '—';
    const { jy, jm, jd } = this.isoToJalali(iso);
    return `${this.WEEKDAYS[this.weekdayIndex(iso)]} ${toFa(jd)} ${this.MONTHS[jm-1]} ${toFa(jy)}`;
  }
  static formatShort(iso){
    if (!iso) return '—';
    const { jy, jm, jd } = this.isoToJalali(iso);
    return `${toFa(jd)} ${this.MONTHS[jm-1]} ${toFa(jy)}`;
  }
  static todayJalali(){ const t = new Date(); return this.fromGregorian(t.getFullYear(), t.getMonth()+1, t.getDate()); }
}

const STATUS_LABELS = { reserved:'رزرو شده', delivered:'تحویل داده شده', returned:'برگردانده شده', cancelled:'لغو شده' };

/* ---------------- لایه ذخیره‌سازی (SRP) ---------------- */
class StorageService {
  constructor(key){ this.key = key; }
  load(fallback){
    try { const raw = localStorage.getItem(this.key); return raw ? JSON.parse(raw) : fallback; }
    catch { return fallback; }
  }
  save(data){ localStorage.setItem(this.key, JSON.stringify(data)); }
}

/* ---------------- مخازن داده (Repository) ---------------- */
class ReservationRepository {
  constructor(storage){ this.storage = storage; this.items = storage.load([]); }
  all(){ return [...this.items]; }
  find(id){ return this.items.find(r => r.id === id); }
  add(r){ this.items.push(r); this.persist(); }
  update(id, patch){ const r = this.find(id); if (r) Object.assign(r, patch); this.persist(); }
  remove(id){ this.items = this.items.filter(r => r.id !== id); this.persist(); }
  replaceAll(items){ this.items = items; this.persist(); }
  persist(){ this.storage.save(this.items); }
}
class ClothingRepository {
  constructor(storage){ this.storage = storage; this.items = storage.load([]); }
  all(){ return [...this.items]; }
  find(id){ return this.items.find(c => c.id === id); }
  findByCode(code){ return this.items.find(c => c.code === code); }
  add(c){ this.items.push(c); this.persist(); }
  update(id, patch){ const c = this.find(id); if (c) Object.assign(c, patch); this.persist(); }
  remove(id){ this.items = this.items.filter(c => c.id !== id); this.persist(); }
  replaceAll(items){ this.items = items; this.persist(); }
  persist(){ this.storage.save(this.items); }
}

/* ---------------- منطق کسب‌وکار رزرو (SRP) ---------------- */
class ReservationService {
  static ACTIVE = ['reserved', 'delivered'];
  constructor(repo){ this.repo = repo; }

  /** محاسبه مبلغ کل و مانده — تنها مرجع محاسبه در کل سامانه */
  calculate({ rentalPrice = 0, cleaningCost = 0, deposit = 0 }){
    const totalAmount = (Number(rentalPrice) || 0) + (Number(cleaningCost) || 0);
    return { totalAmount, remaining: totalAmount - (Number(deposit) || 0) };
  }

  /** تشخیص تداخل: یک کد لباس در یک روز برای دو مشتری فعال */
  findConflicts({ clothingCode, reservationDate, excludeId = null }){
    if (!clothingCode || !reservationDate) return [];
    return this.repo.all().filter(r =>
      r.id !== excludeId &&
      r.clothingCode === clothingCode &&
      r.reservationDate === reservationDate &&
      ReservationService.ACTIVE.includes(r.status)
    );
  }
  hasConflict(data){ return this.findConflicts(data).length > 0; }

  create(data){
    const calc = this.calculate(data);
    const r = { id: uid(), createdAt: new Date().toISOString(), ...data, ...calc };
    this.repo.add(r); return r;
  }
  update(id, data){
    const calc = this.calculate(data);
    this.repo.update(id, { ...data, ...calc });
    return this.repo.find(id);
  }
  remove(id){ this.repo.remove(id); }

  /** جستجو و فیلتر ترکیبی: متن آزاد + وضعیت + بازه تاریخ */
  search({ q = '', status = 'all', from = '', to = '' } = {}){
    const query = q.trim().toLowerCase();
    return this.repo.all()
      .filter(r => status === 'all' || r.status === status)
      .filter(r => !from || r.reservationDate >= from)
      .filter(r => !to || r.reservationDate <= to)
      .filter(r => !query ||
        r.customerName.toLowerCase().includes(query) ||
        (r.mobile || '').includes(query) ||
        (r.clothingCode || '').toLowerCase().includes(query) ||
        (r.clothingName || '').toLowerCase().includes(query))
      .sort((a, b) => a.reservationDate.localeCompare(b.reservationDate));
  }

  byDate(iso){ return this.repo.all().filter(r => r.reservationDate === iso && ReservationService.ACTIVE.includes(r.status)); }
  returningOn(iso){ return this.repo.all().filter(r => r.returnDate === iso && r.status === 'delivered'); }
  upcoming(limit = 6){
    return this.repo.all()
      .filter(r => ReservationService.ACTIVE.includes(r.status) && r.reservationDate >= todayISO())
      .sort((a, b) => a.reservationDate.localeCompare(b.reservationDate))
      .slice(0, limit);
  }
  nextDays(n = 7){
    const t = todayISO();
    return Array.from({ length: n }, (_, i) => {
      const iso = addDaysISO(t, i);
      return { iso, count: this.byDate(iso).length };
    });
  }
  stats(){
    const all = this.repo.all().filter(r => r.status !== 'cancelled');
    const active = this.repo.all().filter(r => ReservationService.ACTIVE.includes(r.status));
    return {
      active: active.length,
      totalRevenue: all.reduce((s, r) => s + (r.totalAmount || 0), 0),
      deposits: all.reduce((s, r) => s + (r.deposit || 0), 0),
      outstanding: all.reduce((s, r) => s + Math.max(r.remaining || 0, 0), 0)
    };
  }
}

/* ---------------- کامپوننت‌های UI مشترک ---------------- */
function toast(message, type = 'success'){
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${icon(type === 'error' ? 'alert' : 'check', 18)}<span>${esc(message)}</span>`;
  $('#toast-root').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 3200);
}

const Modal = {
  show(html, wide = false){
    const root = $('#modal-root');
    root.innerHTML = `<div class="modal-backdrop" id="modal-backdrop">
      <div class="modal ${wide ? 'wide' : ''}" role="dialog">${html}</div></div>`;
    $('#modal-backdrop').addEventListener('click', e => { if (e.target.id === 'modal-backdrop') Modal.close(); });
    return $('.modal', root);
  },
  close(){ $('#modal-root').innerHTML = ''; }
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') Modal.close(); });

function modalHead(title){
  return `<div class="modal-head"><h3>${title}</h3><button class="icon-btn" data-close>${icon('x', 18)}</button></div>`;
}
function bindClose(modal){ $$('[data-close]', modal).forEach(b => b.onclick = () => Modal.close()); }

function confirmDialog({ title, message, confirmText = 'تأیید', onConfirm }){
  const m = Modal.show(`
    ${modalHead(title)}
    <div class="modal-body"><p style="font-size:14px;line-height:2;color:var(--muted)">${message}</p></div>
    <div class="modal-foot">
      <button class="btn btn-outline" data-close>انصراف</button>
      <button class="btn btn-danger" id="confirm-yes">${confirmText}</button>
    </div>`);
  bindClose(m);
  $('#confirm-yes', m).onclick = () => { Modal.close(); onConfirm(); };
}

/* ---------------- انتخاب‌گر تاریخ شمسی ---------------- */
class JalaliDatePicker {
  constructor(container, initialISO){
    this.container = container;
    this.value = initialISO || todayISO();
    this.render();
  }
  render(){
    const { jy, jm, jd } = JalaliDateService.isoToJalali(this.value);
    const curJy = JalaliDateService.todayJalali().jy;
    let years = '';
    for (let y = curJy - 3; y <= curJy + 5; y++)
      years += `<option value="${y}" ${y === jy ? 'selected' : ''}>${toFa(y)}</option>`;
    const months = JalaliDateService.MONTHS.map((m, i) =>
      `<option value="${i+1}" ${i+1 === jm ? 'selected' : ''}>${m}</option>`).join('');
    this.container.innerHTML = `
      <div class="jalali-picker">
        <select class="jp-day" aria-label="روز"></select>
        <select class="jp-month" aria-label="ماه">${months}</select>
        <select class="jp-year" aria-label="سال">${years}</select>
      </div>`;
    this.daySel = $('.jp-day', this.container);
    this.monthSel = $('.jp-month', this.container);
    this.yearSel = $('.jp-year', this.container);
    const syncDays = () => {
      const len = JalaliDateService.monthLength(+this.yearSel.value, +this.monthSel.value);
      const cur = Math.min(+this.daySel.value || jd, len);
      this.daySel.innerHTML = Array.from({ length: len }, (_, i) =>
        `<option value="${i+1}" ${i+1 === cur ? 'selected' : ''}>${toFa(i+1)}</option>`).join('');
    };
    this.yearSel.onchange = syncDays;
    this.monthSel.onchange = syncDays;
    syncDays();
  }
  getISO(){ return JalaliDateService.jalaliToISO(+this.yearSel.value, +this.monthSel.value, +this.daySel.value); }
  setISO(iso){
    const { jy, jm, jd } = JalaliDateService.isoToJalali(iso);
    this.yearSel.value = jy; this.monthSel.value = jm;
    this.monthSel.dispatchEvent(new Event('change'));
    this.daySel.value = jd;
  }
}

  });

  /* محاسبه زنده مبالغ */
  const moneyInputs = ['rentalPrice', 'cleaningCost', 'deposit'].map(n => $(`[name="${n}"]`, m));

      box.classList.remove('show');
      ok.classList.toggle('show', !!code);
    }
  }

  updateCalc(); updateConflict();

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = $('[name="customerName"]', m).value.trim();

    const data = {
      customerName: name, mobile,
      clothingCode: codeInput.value.trim(),
      clothingName: $('[name="clothingName"]', m).value.trim(),
      size: $('[name="size"]', m).value.trim(),

      cleaningCost: Number($('[name="cleaningCost"]', m).value) || 0,
      deposit: Number($('[name="deposit"]', m).value) || 0,
      status: $('[name="status"]', m).value,
      notes: $('[name="notes"]', m).value.trim()
    };
    if (isEdit) app.resService.update(reservation.id, data);
    else app.resService.create(data);
    Modal.close();
    toast(isEdit ? 'رزرو با موفقیت ویرایش شد' : 'رزرو جدید ثبت شد');
    app.refresh();
  });
}

          <div class="field"><label>سایز</label><input name="size" value="${esc(c.size)}" placeholder="۴-۵ سال"></div>
          <div class="field"><label>دسته‌بندی</label>
            <select name="category">${CATEGORIES.map(cat => `<option ${c.category === cat ? 'selected' : ''}>${cat}</option>`).join('')}</select></div>
          <div class="field"><label>قیمت کرایه (تومان)</label>
            <input name="price" type="number" min="0" value="${c.price}" placeholder="250000"></div>
          <div class="field"><label>وضعیت لباس</label>
            <select name="status">${Object.entries(CLOTH_STATUS_LABELS).map(([k, v]) => `<option value="${k}" ${c.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" data-close>انصراف</button>
        <button type="submit" class="btn btn-primary">${icon('check', 17)} ذخیره</button>
      </div>
    </form>`);
  bindClose(m);
  $('#cloth-form', m).addEventListener('submit', e => {
    e.preventDefault();
    const code = $('[name="code"]', m).value.trim();
    const name = $('[name="name"]', m).value.trim();
    $('#cf-code', m).classList.toggle('invalid', !code);
    if (!code || !name){ toast('کد و نام لباس الزامی است', 'error'); return; }
    const data = { code, name, size: $('[name="size"]', m).value.trim(),
      category: $('[name="category"]', m).value, price: Number($('[name="price"]', m).value) || 0,
      status: $('[name="status"]', m).value };
    if (isEdit) app.clothService.update(clothing.id, data); else app.clothService.create(data);
    Modal.close(); toast('لباس ذخیره شد'); app.refresh();
  });
}

/* ---------------- جزئیات یک روز در تقویم ---------------- */
function openDayDetails(app, iso){
  const list = app.resService.repo.all()
    .filter(r => r.reservationDate === iso)
    .sort((a, b) => a.customerName.localeCompare(b.customerName, 'fa'));
  const m = Modal.show(`
    ${modalHead(JalaliDateService.format(iso))}
    <div class="modal-body">
      ${list.length ? list.map(r => {
        const conflict = app.resService.hasConflict({ clothingCode: r.clothingCode, reservationDate: iso, excludeId: r.id });
        return `<div class="day-res-row" data-id="${r.id}">
          <div class="upcoming-avatar">${esc(r.customerName[0] || '؟')}</div>
          <div class="upcoming-info">

            <span>لباس <span class="ltr">${esc(r.clothingCode)}</span> — ${esc(r.clothingName) || ''}</span>
          </div>
          ${conflict ? '<span class="badge conflict">تداخل</span>' : ''}
          <span class="badge ${r.status}">${STATUS_LABELS[r.status]}</span>

    const todayRes = this.app.resService.byDate(todayISO());

        ${this.statCard('رزروهای فعال', toFa(s.active), 'calendar-check', 'blue')}

        ${this.statCard('بیعانه‌های دریافتی (تومان)', fmtMoney(s.deposits), 'check', 'lav')}
        ${this.statCard('مانده قابل وصول (تومان)', fmtMoney(s.outstanding), 'clock', 'danger')}

          ${upcoming.length ? upcoming.map(r => `
            <div class="upcoming-row" data-id="${r.id}">
              <div class="upcoming-avatar">${esc(r.customerName[0] || '؟')}</div>

    if (r.deposit > 0) return '<span class="badge partial">بیعانه پرداخت شده</span>';

      </div>
      <div class="table-wrap">
        ${rows.length ? `<table>
          <thead><tr>
            <th>مشتری</th><th>کد لباس</th><th>لباس</th><th>تاریخ رزرو</th><th>تاریخ برگشت</th>
            <th>مبلغ کل</th><th>بیعانه</th><th>مانده</th><th>پرداخت</th><th>وضعیت</th><th>عملیات</th>
          </tr></thead>
          <tbody>${rows.map(r => {
            const conflict = this.app.resService.hasConflict({ clothingCode: r.clothingCode, reservationDate: r.reservationDate, excludeId: r.id });
            return `<tr>
              <td><div class="cell-customer"><strong>${esc(r.customerName)}</strong><span class="ltr">${esc(r.mobile)}</span></div></td>

              <td>${JalaliDateService.formatShort(r.reservationDate)}</td>
              <td>${JalaliDateService.formatShort(r.returnDate)}</td>
              <td class="money">${fmtMoney(r.totalAmount)}</td>
              <td class="money">${fmtMoney(r.deposit)}</td>
              <td class="money ${r.remaining > 0 ? 'remaining' : 'zero'}">${fmtMoney(r.remaining)}</td>
              <td>${this.paymentBadge(r)}</td>
              <td><span class="badge ${r.status}">${STATUS_LABELS[r.status]}</span>
                  ${conflict ? '<span class="badge conflict" style="margin-inline-start:5px">تداخل</span>' : ''}</td>
              <td><div class="row-actions">
                <button class="icon-btn" data-act="view" data-id="${r.id}" title="مشاهده">${icon('eye', 16)}</button>
                <button class="icon-btn" data-act="edit" data-id="${r.id}" title="ویرایش">${icon('edit', 16)}</button>
                <button class="icon-btn" data-act="print" data-id="${r.id}" title="چاپ رسید">${icon('printer', 16)}</button>
                <button class="icon-btn danger" data-act="del" data-id="${r.id}" title="حذف">${icon('trash', 16)}</button>
              </div></td>
            </tr>`;
          }).join('')}</tbody>
        </table>` : `<div class="empty-state">${icon('search', 44)}<p>رزروی با این مشخصات یافت نشد</p></div>`}
      </div>`;
    const rerender = () => this.render();
    $('#f-q', this.el).addEventListener('input', e => { this.filters.q = e.target.value; rerender(); $('#f-q', this.el).focus(); const v = $('#f-q', this.el); v.setSelectionRange(v.value.length, v.value.length); });
    $('#f-status', this.el).onchange = e => { this.filters.status = e.target.value; rerender(); };

    $('#f-to', this.el).onchange = e => { this.filters.to = e.target.value; rerender(); };

      JalaliDateService.format(r.reservationDate), JalaliDateService.format(r.returnDate),
      r.rentalPrice, r.cleaningCost, r.totalAmount, r.deposit, r.remaining, STATUS_LABELS[r.status]
    ].map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')));
    download(new Blob(['\uFEFF' + lines.join('\n')], { type:'text/csv;charset=utf-8' }), 'reservations.csv');
    toast('فایل اکسل دانلود شد');
  }
}

class CalendarView {
  constructor(app){
    this.app = app; this.el = $('#view-calendar');
    const t = JalaliDateService.todayJalali();
    this.jy = t.jy; this.jm = t.jm;
  }
  render(){
    const { jy, jm } = this;
    const len = JalaliDateService.monthLength(jy, jm);
    const firstISO = JalaliDateService.jalaliToISO(jy, jm, 1);
    const offset = JalaliDateService.weekdayIndex(firstISO);
    const today = todayISO();
    const byDay = {};
    this.app.resService.repo.all().forEach(r => {
      const j = JalaliDateService.isoToJalali(r.reservationDate);
      if (j.jy === jy && j.jm === jm) (byDay[r.reservationDate] ||= []).push(r);
    });
    let cells = '';
    for (let i = 0; i < offset; i++) cells += '<div class="cal-day empty"></div>';
    for (let d = 1; d <= len; d++){
      const iso = JalaliDateService.jalaliToISO(jy, jm, d);
      const dayRes = byDay[iso] || [];
      const conflict = dayRes.some(r => this.app.resService.hasConflict({ clothingCode: r.clothingCode, reservationDate: iso, excludeId: r.id }));
      const shown = dayRes.slice(0, 2);
      cells += `<div class="cal-day ${iso === today ? 'today' : ''} ${conflict ? 'conflict' : ''} ${dayRes.length ? 'has-res' : ''}" data-date="${iso}">
        <span class="cal-day-num">${toFa(d)}</span>
        <div class="cal-chips">
          ${shown.map(r => `<span class="cal-chip ${r.status}"><span class="ltr">${esc(r.clothingCode)}</span> · ${esc(r.customerName)}</span>`).join('')}
          ${dayRes.length > 2 ? `<span class="cal-more">+${toFa(dayRes.length - 2)} رزرو دیگر</span>` : ''}
        </div>
      </div>`;
    }
    this.el.innerHTML = `
      <div class="cal-head">
        <div class="cal-title">${JalaliDateService.MONTHS[jm-1]} ${toFa(jy)}</div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="icon-btn" id="cal-prev">${icon('chevron-right', 18)}</button>
          <button class="btn btn-outline btn-sm" id="cal-today">امروز</button>
          <button class="icon-btn" id="cal-next">${icon('chevron-left', 18)}</button>
        </div>
      </div>
      <div class="cal-grid">
        ${JalaliDateService.WEEKDAYS.map((w, i) => `<div class="cal-weekday ${i === 6 ? 'friday' : ''}">${w}</div>`).join('')}
        ${cells}
      </div>
      <p style="margin-top:14px;font-size:12.5px;color:var(--muted)">روی هر روز کلیک کنید تا رزروهای آن روز را ببینید یا رزرو جدید ثبت کنید. روزهای با حاشیه قرمز دارای تداخل رزرو هستند.</p>`;
    $('#cal-prev', this.el).onclick = () => { this.jm--; if (this.jm < 1){ this.jm = 12; this.jy--; } this.render(); };
    $('#cal-next', this.el).onclick = () => { this.jm++; if (this.jm > 12){ this.jm = 1; this.jy++; } this.render(); };
    $('#cal-today', this.el).onclick = () => { const t = JalaliDateService.todayJalali(); this.jy = t.jy; this.jm = t.jm; this.render(); };
    $$('.cal-day[data-date]', this.el).forEach(c => c.onclick = () => openDayDetails(this.app, c.dataset.date));
  }
}

/* ============================================================================
   App — ریشه ترکیب و تزریق وابستگی‌ها (Composition Root)
   ============================================================================ */
class App {
  constructor(){
    const resStorage = new StorageService('mezon-reservations-v1');
    const clothStorage = new StorageService('mezon-clothes-v1');
    this.resRepo = new ReservationRepository(resStorage);
    this.clothRepo = new ClothingRepository(clothStorage);
    this.resService = new ReservationService(this.resRepo);
    this.clothService = new ClothingService(this.clothRepo, this.resService);
    this.seedIfEmpty();
    this.views = {
      dashboard: new DashboardView(this),
      reservations: new ReservationsView(this),
      calendar: new CalendarView(this),
      inventory: new InventoryView(this)
    };
    this.titles = { dashboard:'داشبورد', reservations:'رزروها', calendar:'تقویم رزروها', inventory:'موجودی لباس‌ها' };
    this.currentView = 'dashboard';
    this.bindGlobalEvents();
    this.navigate('dashboard');
  }
  seedIfEmpty(){
    if (!this.clothRepo.all().length) seedClothes().forEach(c => this.clothService.create(c));
    if (!this.resRepo.all().length) seedReservations().forEach(r => this.resService.create(r));
  }
  navigate(view){
    this.currentView = view;
    $$('.view').forEach(v => v.classList.remove('active'));
    $(`#view-${view}`).classList.add('active');
    $$('#main-nav .nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    $('#page-title').textContent = this.titles[view];
    this.views[view].render();
    this.updateBadges();
    $('#sidebar').classList.remove('open');
    $('#overlay').classList.remove('show');
  }
  refresh(){ this.views[this.currentView].render(); this.updateBadges(); }
  updateBadges(){ $('#nav-res-count').textContent = toFa(this.resService.stats().active); }
  bindGlobalEvents(){
    $$('#main-nav .nav-item').forEach(b => b.onclick = () => this.navigate(b.dataset.view));
    $('#btn-new-reservation').onclick = () => openReservationForm(this);
    $('#menu-btn').innerHTML = icon('menu', 20);
    $('#menu-btn').onclick = () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); };
    $('#overlay').onclick = () => { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); };
    $('#brand-logo').innerHTML = icon('shirt', 26);
    $$('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon, 19); });
    $('#btn-backup').onclick = () => {
      const data = { exportedAt: new Date().toISOString(), reservations: this.resRepo.all(), clothes: this.clothRepo.all() };
      download(new Blob([JSON.stringify(data, null, 2)], { type:'application/json' }), 'mezon-backup.json');
      toast('پشتیبان‌گیری دانلود شد');
    };
    $('#btn-restore').onclick = () => $('#file-restore').click();
    $('#file-restore').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!Array.isArray(data.reservations) || !Array.isArray(data.clothes)) throw new Error('bad format');
          confirmDialog({
            title:'بازیابی اطلاعات', message:'اطلاعات فعلی با داده‌های فایل پشتیبان جایگزین شود؟',
            confirmText:'بازیابی', onConfirm: () => {
              this.resRepo.replaceAll(data.reservations);
              this.clothRepo.replaceAll(data.clothes);
              toast('اطلاعات بازیابی شد'); this.refresh();
            }
          });
        } catch { toast('فایل پشتیبان معتبر نیست', 'error'); }
      };
      reader.readAsText(file);
      e.target.value = '';
    });
  }
}

/* ---------------- راه‌اندازی ---------------- */
document.addEventListener('DOMContentLoaded', () => new App());
</script>
