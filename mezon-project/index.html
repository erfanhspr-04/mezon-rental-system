<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مزون کودکانه | سامانه کرایه لباس</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <!-- ============ نوار کناری ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brand-logo"></div>
      <div>
        <h1>مزون کودکانه</h1>
        <p>سامانه کرایه لباس</p>
      </div>
    </div>
    <nav class="nav" id="main-nav">
      <button class="nav-item active" data-view="dashboard"><span data-icon="home"></span> داشبورد</button>
      <button class="nav-item" data-view="reservations"><span data-icon="calendar-check"></span> رزروها <span class="nav-badge" id="nav-res-count">۰</span></button>
      <button class="nav-item" data-view="calendar"><span data-icon="calendar"></span> تقویم</button>
      <button class="nav-item" data-view="inventory"><span data-icon="shirt"></span> لباس‌ها</button>
    </nav>
    <div class="sidebar-footer">
      <button id="btn-backup"><span data-icon="download"></span> پشتیبان‌گیری (خروجی)</button>
      <button id="btn-restore"><span data-icon="upload"></span> بازیابی اطلاعات</button>
      <input type="file" id="file-restore" accept=".json,application/json" hidden>
      <div class="sidebar-ver">نسخه ۱.۰ — اطلاعات روی همین دستگاه ذخیره می‌شود</div>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <!-- ============ بخش اصلی ============ -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="منو"></button>
      <h2 id="page-title">داشبورد</h2>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="btn-new-reservation"><span data-icon="plus"></span> رزرو جدید</button>
      </div>
    </header>
    <div class="content">
      <section id="view-dashboard" class="view"></section>
      <section id="view-reservations" class="view"></section>
      <section id="view-calendar" class="view"></section>
      <section id="view-inventory" class="view"></section>
    </div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="receipt-print"></div>

<script src="js/app.js"></script>
</body>
</html>
